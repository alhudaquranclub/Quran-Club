<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Al-Huda Quran Club</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="Untitled_Design-removebg-preview.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar" id="main-navbar">
        <div class="navleft">
            <img src="Al-Hudā Qur’ān Club Logo-Photoroom.png" alt="Al-Huda Quran Club Logo">
        </div>

        <button class="menu-icon-btn" type="button" aria-label="Toggle Menu" aria-controls="main-navbar" aria-expanded="false">
            <span class="line line1"></span>
            <span class="line line2"></span>
            <span class="line line3"></span>
        </button>

        <div class="navright">
            <a href="index.html">Home</a>
            <a href="result.html">Results</a>
            <a href="gallery.html" aria-current="page">Gallery</a>
        </div>
    </nav>

    <main class="gallery-container">
        <header class="gallery-heading">
            <h1>Club <span class="accent">Gallery</span></h1>
            <p>Photos and videos from our Quran Club community.</p>
        </header>
        <section aria-label="Gallery items">
            <div class="gallery-grid">
                
                <article class="gallery-item">
                    <button class="gallery-image-button" type="button" data-gallery-action="view" aria-label="View Gallery Image 1 full size">
                        <img src="event.png" alt="Gallery Image 1" loading="lazy">
                        <span class="gallery-image-view-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
                            </svg>
                        </span>
                    </button>
                    <div class="gallery-actions">
                        <a class="gallery-action-link" href="event.png" download aria-label="Download Gallery Image 1">
                            <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 19h14"/>
                            </svg>
                        </a>
                        <button class="gallery-action-button" type="button" data-gallery-action="share" aria-label="Share Gallery Image 1">
                            <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4"/>
                            </svg>
                        </button>
                    </div>
                </article>
                <article class="gallery-item">
                    <button class="gallery-image-button" type="button" data-gallery-action="view" aria-label="View Al-Huda Quran Club Logo full size">
                        <img src="guest.png" alt="Al-Huda Quran Club Logo" loading="lazy">
                        <span class="gallery-image-view-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
                            </svg>
                        </span>
                    </button>
                    <div class="gallery-actions">
                        <a class="gallery-action-link" href="guest.png" download aria-label="Download Al-Huda Quran Club Logo">
                            <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 19h14"/>
                            </svg>
                        </a>
                        <button class="gallery-action-button" type="button" data-gallery-action="share" aria-label="Share Al-Huda Quran Club Logo">
                            <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4"/>
                            </svg>
                        </button>
                    </div>
                </article>
                <article class="gallery-item">
                    <button class="gallery-image-button" type="button" data-gallery-action="view" aria-label="View Gallery Image 1 full size">
                        <img src="mentors.png" alt="Gallery Image 1" loading="lazy">
                        <span class="gallery-image-view-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
                            </svg>
                        </span>
                    </button>
                    <div class="gallery-actions">
                        <a class="gallery-action-link" href="mentors.png" download aria-label="Download Gallery Image 1">
                            <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 19h14"/>
                            </svg>
                        </a>
                        <button class="gallery-action-button" type="button" data-gallery-action="share" aria-label="Share Gallery Image 1">
                            <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4"/>
                            </svg>
                        </button>
                    </div>
                </article>
                <article class="gallery-item">
                    <button class="gallery-image-button" type="button" data-gallery-action="view" aria-label="View Gallery Image 2 full size">
                        <img src="firstbatch.png" alt="Gallery Image 2" loading="lazy">
                        <span class="gallery-image-view-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
                            </svg>
                        </span>
                    </button>
                    <div class="gallery-actions">
                        <a class="gallery-action-link" href="firstbatch.png" download aria-label="Download Gallery Image 2">
                            <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 19h14"/>
                            </svg>
                        </a>
                        <button class="gallery-action-button" type="button" data-gallery-action="share" aria-label="Share Gallery Image 2">
                            <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4"/>
                            </svg>
                        </button>
                    </div>
                </article>
            </div>
            <p class="gallery-action-status" id="gallery-action-status" role="status" aria-live="polite"></p>
        </section>
        <dialog class="gallery-viewer" id="gallery-viewer" aria-label="Full-size gallery image">
            <div class="gallery-viewer-content">
                <form method="dialog" class="gallery-viewer-header">
                    <button class="gallery-action-button" type="submit" aria-label="Close full-size image">
                        <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
                            <path d="m6 6 12 12M18 6 6 18"/>
                        </svg>
                    </button>
                </form>
                <img id="gallery-viewer-image" alt="">
                <div class="gallery-actions">
                    <a class="gallery-action-link" id="gallery-viewer-download" href="#" download aria-label="Download full-size image">
                        <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 19h14"/>
                        </svg>
                    </a>
                    <button class="gallery-action-button" type="button" data-gallery-action="share-viewer" aria-label="Share full-size image">
                        <svg class="gallery-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4"/>
                        </svg>
                    </button>
                </div>
            </div>
        </dialog>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Al-Huda Quran Club. All rights reserved.</p>
        <a href="admin.html" class="admin-link-icon" aria-label="Admin Portal">
            <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/><path d="M12 13c-2 0-4 1-4 3v1h8v-1c0-2-2-3-4-3z"/>
            </svg>
        </a>
    </footer>
    <script src="site.js"></script>
</body>
</html>
